<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineTV">
<title>CineTV by Alptuğ Dağ</title>
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="static/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="static/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="static/icon.png">
<style>
:root{
  --bg:#07070c;--ink:#f5f5f7;--dim:rgba(235,235,245,.6);--faint:rgba(235,235,245,.32);
  --glass:rgba(255,255,255,.08);--glass-hi:rgba(255,255,255,.14);--edge:rgba(255,255,255,.16);
  --accent:#8b5cf6;--accent2:#c4b5fd;--ok:#34d399;--radius:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
  background:radial-gradient(40% 35% at 20% 10%,rgba(139,92,246,.35),transparent 70%),
             radial-gradient(35% 30% at 85% 30%,rgba(56,189,248,.18),transparent 70%),
             radial-gradient(45% 40% at 50% 100%,rgba(236,72,153,.16),transparent 70%);filter:blur(10px)}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  background:linear-gradient(var(--bg) 55%,transparent)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand b{font-size:22px;letter-spacing:-.02em}
.tv{color:#ff1e1e}
.brand .logo{width:38px;height:38px;border-radius:9px;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.45);flex-shrink:0}
.brand .sig{width:30px;height:30px;object-fit:contain;margin-left:-4px;margin-right:-2px;opacity:.92}
.brand .st{font-size:12px;color:var(--dim);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.brand em{font-style:normal}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .25s,box-shadow .25s}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.search{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:rgba(196,181,253,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 3px rgba(139,92,246,.22),0 10px 30px rgba(0,0,0,.4)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:16px;min-width:0}
.search svg{opacity:.7;flex-shrink:0}
.qmic{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;padding:0;flex-shrink:0;transition:transform .18s,background .2s}
.qmic:active{transform:scale(.9)}
.qmic.on{background:var(--accent);box-shadow:0 0 16px var(--accent)}
.moods{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 2px 2px;margin:0 -2px}
.moods::-webkit-scrollbar{display:none}
.mtag{flex-shrink:0;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:transform .18s,background .2s,border-color .2s}
.mtag:active{transform:scale(.95)}
.mtag.creator{background:linear-gradient(135deg,rgba(229,9,20,.22),rgba(139,92,246,.22));border-color:rgba(229,9,20,.42);color:#fff}
.voice-edge{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;transition:opacity .28s ease;
  box-shadow:inset 0 0 28px 6px rgba(139,92,246,.75),inset 0 0 65px 14px rgba(56,189,248,.45),inset 0 0 110px 20px rgba(229,9,20,.35);
  animation:edgePulse 1.4s ease-in-out infinite alternate}
.voice-edge.on{opacity:1}
@keyframes edgePulse{
  0%{box-shadow:inset 0 0 24px 5px rgba(56,189,248,.8),inset 0 0 58px 12px rgba(139,92,246,.55),inset 0 0 95px 18px rgba(236,72,153,.35)}
  100%{box-shadow:inset 0 0 36px 9px rgba(229,9,20,.85),inset 0 0 78px 18px rgba(139,92,246,.65),inset 0 0 120px 26px rgba(56,189,248,.45)}
}
main{padding:0 16px calc(96px + var(--safe-b));max-width:960px;margin:0 auto}
section{display:none;animation:fadeIn .22s cubic-bezier(.22,1,.36,1)}section.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:740px){.grid{grid-template-columns:repeat(5,1fr);gap:14px}}
@media(max-width:350px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/3;background:var(--glass);
  box-shadow:0 8px 20px rgba(0,0,0,.45);transform:translateZ(0);transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s;contain:layout paint}
.card:active{transform:scale(.95)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;font-size:11.5px;font-weight:600;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.card .badge{position:absolute;top:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55)}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.answer{padding:14px 16px;font-size:15px;line-height:1.45;border-left:3px solid var(--accent2)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:9;display:flex;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:11px;padding:8px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink);background:var(--glass-hi)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);
  border-radius:28px 28px 0 0;padding:18px 18px calc(22px + var(--safe-b));max-height:86vh;overflow:auto}
.sheet.on{transform:none}
.sheet .row{display:flex;gap:16px}
.sheet img{width:110px;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.sheet h3{margin:4px 0 6px;font-size:20px;line-height:1.2}
.meta{color:var(--dim);font-size:13px}
.ov{color:var(--dim);font-size:14px;margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#9b6cff,#7c3aed);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(124,58,237,.45)}
a.btn{text-decoration:none}
label.btn{cursor:pointer}
.install{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.install span{flex:1}
.install button{border:0;border-radius:12px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
.install .x{background:none;color:var(--dim);padding:6px}
.btn.ghost{background:var(--glass-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-140%);transition:.3s;z-index:40;padding:10px 18px;font-size:14px}
.toast.on{transform:translate(-50%,0)}
/* remote: one screen, no scrolling, no zoom; a touchpad like the TV makers' own apps, in liquid glass */
html,body,button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.remote header .search{display:none}
body.remote main{padding-bottom:0}
#tab-remote.on{display:flex;flex-direction:column;gap:12px;height:calc(100dvh - var(--hdr,96px) - 84px - var(--safe-b));min-height:420px}
.rbar{display:flex;align-items:center;justify-content:space-between}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0}
.ic svg{width:24px;height:24px}
.pwr{color:#4ade80;transition:background .2s,color .2s}
.pwr.arm{background:rgba(255,59,48,.85);color:#fff;border-color:transparent}
.rbar .hint{font-size:12px;color:var(--dim);text-align:center;flex:1;padding:0 8px}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:28px}
.deck::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;min-height:0;position:relative}
.touch{height:100%;border-radius:28px;touch-action:none;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 45%,rgba(255,255,255,.07))}
.touch::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 30% 0%,rgba(255,255,255,.16),transparent 55%)}
.touch .ripple{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.35),transparent 70%);animation:rip .45s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.touch .arrow{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:rgba(255,255,255,.55);pointer-events:none;opacity:0;transition:opacity .25s}
.touch .arrow.on{opacity:1;transition:none}
.touch .tip{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:var(--faint);pointer-events:none}
.mchip{position:absolute;top:12px;right:12px;z-index:2;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink)}
.mchip.on{background:var(--accent);border-color:transparent}
.touch.mouse{background:linear-gradient(160deg,rgba(139,92,246,.22),rgba(255,255,255,.04) 55%,rgba(56,189,248,.12))}
.more{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;padding:2px}
.more button{border-radius:20px;color:var(--ink);font-size:13px;font-weight:600;padding:0;min-height:0}
.more .c{border:0;margin:18% 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.more .w2{grid-column:span 2}
.nums{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;height:100%}
.nums button{border-radius:20px;color:var(--ink);font-size:22px;font-weight:600;padding:0}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background .2s}
.dots i.on{background:var(--ink)}
.ctl{display:grid;grid-template-columns:1fr 3fr 1fr;gap:12px;align-items:stretch}
.rocker{display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:40px;padding:4px 0}
.rocker button{background:none;border:0;color:var(--ink);font-size:28px;width:100%;padding:12px 0;line-height:1}
.rocker span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dim)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;place-items:center}
.rgrid button{width:min(64px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--ink);padding:0}
.rgrid svg{width:26px;height:26px}
.rgrid .on{background:var(--accent);border-color:transparent}
[data-key]:active,.rgrid button:active,.ic:active{transform:scale(.93)}
.kbd{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:30;display:flex;gap:8px;padding:6px 6px 6px 14px;align-items:center}
.kbd input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:16px}
.kbd button{border:0;border-radius:14px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600}
/* cast: the TV browses, the phone sees and taps */
#tab-cast.on{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - var(--hdr,96px) - 84px - var(--safe-b));min-height:420px}
.urlbar{display:flex;gap:6px;padding:6px 6px 6px 14px;align-items:center}
.urlbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:16px}
.ub{border:0;border-radius:12px;padding:9px 11px;background:var(--glass-hi);color:var(--ink);font-weight:600}
.ub.go{background:var(--accent);color:#fff}
.bwrap{flex:1;min-height:0;display:flex;margin:0 -10px}
.bview{position:relative;flex:1;height:100%;border-radius:18px;overflow:hidden;touch-action:none;background:#000}
.bview img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.bhint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--dim);font-size:14px}
.bprog{position:absolute;left:0;top:0;height:3px;width:0;background:var(--accent2);transition:width .3s}
.btools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btools button{border-radius:14px;padding:10px 0;color:var(--ink);font-size:18px}
.bstatus{font-size:12.5px;color:var(--dim);text-align:center;min-height:18px}
.bstatus.ok{color:var(--ok);font-weight:600}
/* calibration */
.cal{padding:16px;margin-top:12px}
.slider{margin:14px 0}
.slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:6px}
.slider label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.3))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px}
.chip.on{background:var(--accent);border-color:transparent}
.note{font-size:12.5px;color:var(--dim);margin-top:8px}
.brand small{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.01em;margin-left:-4px;align-self:flex-end;padding-bottom:3px}
.wait{padding:14px 16px;margin-top:12px;display:flex;gap:12px;align-items:center;font-size:14px}
.wait i{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.3;transform:scale(.7)}}
.about{padding:22px 18px;margin-top:14px;text-align:center}
.about .sig2{width:120px;height:52px;object-fit:contain;margin:2px auto 0;display:block;opacity:.92}
.about .photo-ring{position:relative;display:inline-block}
.about .photo-ring::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg,#f58529,#dd2a7b,#8134af,#38bdf8,#f58529);
  z-index:-1;opacity:.85;filter:blur(6px);animation:spinRing 8s linear infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}
.about img.photo{width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:70% 30%;box-shadow:0 10px 30px rgba(0,0,0,.55);border:2.5px solid rgba(255,255,255,.28);display:block}
.about h3{margin:14px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.about .role{color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.about p{color:var(--dim);font-size:14px;text-align:left;margin:14px 0 18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 15px;line-height:1.52}
.follow{display:grid;gap:10px;margin-top:6px}
.follow .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.follow .row2{grid-template-columns:1fr}}
@media(max-height:680px){
  #tab-remote.on{gap:8px;min-height:360px}
  .rgrid button{width:min(52px,100%)}
  .rocker button{padding:8px 0;font-size:24px}
}
.btn.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px rgba(221,42,123,.4)}
.btn.lb{background:linear-gradient(90deg,#ff8000,#00e054 50%,#40bcf4);box-shadow:0 10px 24px rgba(0,224,84,.25)}
.btn.li{background:linear-gradient(180deg,#0a66c2,#004182);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(10,102,194,.35)}
.btn.gh{background:linear-gradient(180deg,#2d333b,#161b22);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.btn.yt{background:linear-gradient(180deg,#ff3b3b,#d40000);box-shadow:0 10px 24px rgba(212,0,0,.4)}
.btn.tr{background:linear-gradient(135deg,#334155,#0f172a);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.4)}
.cast{padding:16px;margin-top:12px}
.cast textarea{width:100%;min-height:84px;background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:15px/1.4 inherit;padding:12px;resize:vertical;outline:0}
.found{display:grid;gap:8px;margin-top:12px}
.found button{text-align:left;border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;word-break:break-all}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="voice-edge" id="voiceEdge"></div>
<div id="app">
<header>
  <div class="brand"><img class="sig" src="static/signature.png" alt="" style="cursor:pointer" onclick="document.querySelector('[data-tab=about]').click()" onerror="this.remove()"><b>Cine<span class="tv">TV</span></b><small style="cursor:pointer" onclick="document.querySelector('[data-tab=about]').click()">by Alptuğ Dağ</small><span class="st" id="tvPick"><i id="dot" class="dot"></i><em id="status" data-i="connecting"></em></span></div>
  <div class="install glass" id="install" hidden><span id="installText"></span><button id="installGo" hidden></button><button class="x" id="installX">✕</button></div>
  <form class="search glass" id="searchBox" action="javascript:void(0);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" data-ph="searchPh">
    <button type="button" class="qmic" id="qMic" aria-label="Voice Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 17.5V21" stroke="currentColor" stroke-width="2"/></svg></button>
  </form>
</header>

<main>
  <section id="tab-search" class="on">
    <div class="moods" id="moodStrip">
      <button type="button" class="mtag creator" data-q="Alptuğ Dağ filmleri" data-i="mCreator">✦ Alptuğ Dağ Seçkisi</button>
      <button type="button" class="mtag" data-q="Gece yarısı neo-noir gerilim filmleri" data-i="mNoir">🌙 Gece Yarısı Neo-Noir</button>
      <button type="button" class="mtag" data-q="Yağmurlu gecede izlenecek atmosferik filmler" data-i="mRain">🌧️ Yağmurlu Gece</button>

  addEventListener("resize", fitHeader);


  // cast: the TV opens the page in a browser nobody sees; the phone shows it and taps it. The viewer skips
  // the ads and presses the film's play; the film's stream (3 minutes or more) then plays on the TV.
  let browsing = false, opened = false, frameT = null;
  const bImg = $("bImg"), bView = $("bView");
  const direct = u => /\.(m3u8|mp4|m4v|webm|mkv|mpd)(\?|#|$)/i.test(u) || /youtube\.com\/|youtu\.be\//i.test(u);
  $("castPaste").onclick = async () => { try { $("castUrl").value = await navigator.clipboard.readText(); } catch (e) { $("castUrl").focus(); } };
  const castPlay = async (u, ref) => {
    try { const r = await api("cast/play", {url: u, ref: ref || ""}); toast(r.ok ? t("castPlaying") : t("castNone")); } catch (e) {}
  };
  $("bForm").addEventListener("submit", async () => {
    let u = $("castUrl").value.trim(); if (!u) return;
    $("castUrl").blur();
    if (direct(u)) return castPlay(/^https?:/i.test(u) ? u : "https://" + u);
    try {
      const vr = bView.getBoundingClientRect();
      const r = await api("browse/open", {url: u, ar: (vr.height / Math.max(1, vr.width)).toFixed(3)});
      if (!r.ok) return toast(t("castNone"));
      opened = true; $("bHint").hidden = true; $("castFound").innerHTML = ""; $("bStatus").className = "bstatus";
      $("bStatus").textContent = t("browseTip"); browseLoop();
    } catch (e) { toast(t("offline")); }
  });
  const browseLoop = () => {
    if (browsing || !opened) return; browsing = true;
    const next = () => {
      if (!browsing) return;
      if (RELAY) {
        api("browse/frame").then(r => { if (r.ok && r.img) bImg.src = "data:image/jpeg;base64," + r.img; frameT = setTimeout(next, 150); })
          .catch(() => { frameT = setTimeout(next, 900); });
        return;
      }
      const img = new Image();
      img.onload = () => { bImg.src = img.src; frameT = setTimeout(next, 150); };
      img.onerror = () => { frameT = setTimeout(next, 900); };
      img.src = "/api/browse/frame?k=" + encodeURIComponent(token) + "&t=" + Date.now();
    };
    next();
    const poll = async () => {
      if (!browsing) return;
      try {
        const st = await api("browse/status");
        $("bProg").style.width = st.loading ? Math.max(8, st.progress) + "%" : "0";
        if (st.title) document.querySelector("#bForm input").placeholder = st.title;
        const films = st.found || [];
        if (st.sent) { $("bStatus").className = "bstatus ok"; $("bStatus").textContent = "▶ " + t("castPlaying"); }
        if (!st.sent && films.length) { $("bStatus").className = "bstatus ok"; $("bStatus").textContent = t("filmFound"); }
        $("castFound").innerHTML = films.map((v, i) => `<button data-v="${i}">▶︎ ${t("playOnTv")} · ${esc(v.label || v.url)}</button>`).join("");
        $("castFound").querySelectorAll("button").forEach(b => b.onclick = () => { const v = films[+b.dataset.v]; castPlay(v.url, v.ref); });
      } catch (e) {}
      setTimeout(poll, 1000);
    };
    poll();
  };
  // taps and swipes on the picture reach the page on the TV
  let bx = 0, by = 0, bt = 0;
  bView.addEventListener("pointerdown", e => { if (!opened) return; e.preventDefault(); bView.setPointerCapture(e.pointerId); bx = e.clientX; by = e.clientY; bt = Date.now(); });
  bView.addEventListener("pointerup", e => {
    if (!opened || !bt) return;
    const r = bView.getBoundingClientRect(), dx = e.clientX - bx, dy = e.clientY - by; bt = 0;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      api("browse/tap", {x: ((e.clientX - r.left) / r.width).toFixed(4), y: ((e.clientY - r.top) / r.height).toFixed(4)}).catch(() => {});
      navigator.vibrate && navigator.vibrate(8);
    } else api("browse/scroll", {dy: (-dy / r.height).toFixed(4)}).catch(() => {});
  });
  $("bBack").onclick = () => api("browse/back").catch(() => {});
  $("bReload").onclick = () => api("browse/reload").catch(() => {});
  $("bClose").onclick = () => { api("browse/close").catch(() => {}); opened = false; browsing = false; bImg.removeAttribute("src"); $("bHint").hidden = false; $("castFound").innerHTML = ""; };
  $("bType").onclick = () => { const q = prompt(t("typePh")); if (q) api("browse/type", {q, enter: 1}).catch(() => {}); };

  // about
  $("igBtn").href = "https://instagram.com/alptugdag";
  $("ytBtn").href = "https://www.youtube.com/@AlptugDag?sub_confirmation=1";
  $("hisFilms").onclick = () => api("tv/search", {q: "Alptuğ Dağ filmleri"}).then(() => toast(t("onTv"))).catch(() => {});
  if ($("playSessizTv")) {
    $("playSessizTv").onclick = () => api("open", {imdb: "tt38983576", tmdb: 1124567, type: "movie", title: "Sessiz"}).then(() => toast(t("opening"))).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && token) {
      api("hello").then(() => { $("dot").classList.add("on"); $("status").textContent = $("status").dataset.tv || t("connected"); }).catch(() => {});
    }
  });
  open("about").then(a => {
    // Builds without the author's photo file fall back to his TMDB portrait.
    const ph = $("aboutPhoto"); if (a.photo && ph && (ph.hidden || !ph.naturalWidth)) { ph.src = a.photo; ph.hidden = false; }
  }).catch(() => {});

  // background from the phone: resized here (max 1920 px), sent as JPEG
  $("bgFile").onchange = async e => {
    const file = e.target.files && e.target.files[0]; if (!file || !token) return;
    try {
      const img = await createImageBitmap(file);
      // over the direct link one message carries it: a smaller picture
      const s = Math.min(1, (RELAY ? 1024 : 1920) / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", RELAY ? 0.74 : 0.86));
      $("bgPreview").src = URL.createObjectURL(blob); $("bgPreview").hidden = false;
      if (RELAY) {
        const data = cv.toDataURL("image/jpeg", 0.74).split(",")[1];
        toast((await api("wallpaper64", {data})).ok ? t("bgSent") : t("bgFail"));
        return;
      }
      const r = await fetch("/api/wallpaper?k=" + encodeURIComponent(token), {method: "POST", body: blob, headers: {"Content-Type": "image/jpeg"}});
      toast((await r.json()).ok ? t("bgSent") : t("bgFail"));
    } catch (err) { toast(t("bgFail")); }
  };
  const bgResetBtn = $("bgReset");
  if (bgResetBtn) {
    bgResetBtn.onclick = async () => {
      try {
        await api("wallpaper/reset");
        $("bgPreview").hidden = true;
        toast(t("bgResetDone"));
      } catch (e) { toast(t("offline")); }
    };
  }

  // "Add to Home Screen": a real prompt on Android, a hint on iPhone; never once it is installed
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem("cinetv.installX") === "1"; } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register(RELAY ? "sw.js" : "/sw.js").catch(() => {});
  const showInstall = (text, go) => {
    if (standalone || dismissed) return;
    $("installText").textContent = text; $("install").hidden = false;
    if (go) { $("installGo").textContent = t("installGo"); $("installGo").hidden = false; $("installGo").onclick = go; }
  };
  $("installX").onclick = () => { $("install").hidden = true; try { localStorage.setItem("cinetv.installX", "1"); } catch (e) {} };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); showInstall(t("installAndroid"), () => { e.prompt(); $("install").hidden = true; }); });
  if (/iPhone|iPad/.test(navigator.userAgent) && !standalone) showInstall(t("installIos"));

  // several CineTV TVs on this network: tap the status to switch
  open("info").then(info => {
    if (info.name) $("status").dataset.tv = info.name;
    const peers = info.peers || [];
    if (!peers.length) return;
    $("tvPick").style.cursor = "pointer";
    $("tvPick").onclick = () => {
      sheet.innerHTML = `<h3>${t("otherTvs")}</h3>` + [{name: info.name, url: ""}].concat(peers).map(p =>
        `<button class="btn ${p.url ? "ghost" : ""}" style="margin-top:10px" data-u="${esc(p.url)}">📺 ${esc(p.name)}</button>`).join("");
      sheet.classList.add("on"); bg.classList.add("on");
      sheet.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { if (b.dataset.u) location.href = b.dataset.u; else closeSheet(); });
    };
  }).catch(() => {});

  // connect
  const connected = () => {
    api("hello").then(() => {
      $("dot").classList.add("on");
      $("status").textContent = $("status").dataset.tv || t("connected");
    }).catch(() => {
      if (token) {
        token = null;
        try {
          localStorage.removeItem("cinetv.k");
          sessionStorage.removeItem("cinetv.k");
          setCookie("cinetv_k", "");
        } catch (e) {}
        pair();
      }
    });
    trending();
  };
  if (token) connected(); else pair();
  const start = RELAY ? (hp.get("s") || location.hash.replace("#", "")) : location.hash.replace("#", "");
  if (["remote", "search", "cast", "about", "bg", "background"].includes(start)) show(start === "background" ? "bg" : start);
})();
</script>
</body>
</html>
