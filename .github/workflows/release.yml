name: Release

# Push a tag like v2.0.0 to build, sign, verify and publish a release.
# A push to main that changes the version in launcher/build.gradle publishes that
# version too, so a release is never forgotten when no tag was pushed.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['launcher/build.gradle', 'CHANGELOG.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v2.0.0'
        required: true

permissions:
  contents: write

jobs:
  # Without the signing secrets the release is built and signed locally instead
  # (scripts/release/), so the job below is skipped rather than failed.
  check:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"
          else
            # main: the default version in launcher/build.gradle, published only if not released yet
            TAG="v$(sed -n "s/.*findProperty('cineTvVersion') ?: '\([0-9.]*\)'.*/\1/p" launcher/build.gradle | head -1)"
            if [ "$TAG" = v ] || gh release view "$TAG" >/dev/null 2>&1; then TAG=""; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG:-none (already released)}"
      - name: Check signing secrets
        id: secrets
        env:
          KS: ${{ secrets.CINETV_RELEASE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.CINETV_RELEASE_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.CINETV_RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$AL" ]; then
            # nothing new to publish (version already released) is a skip, not a failure
            if [ -n "${{ steps.tag.outputs.tag }}" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No release signing secrets; skipping. Sign locally with scripts/release/ and upload the APK by hand."
          fi

  release:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: release
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # a main push builds the commit itself; the tag is created on it when the release is published
          ref: ${{ github.ref_type == 'branch' && github.sha || env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore (temporary, deleted after the job)
        env:
          KS: ${{ secrets.CINETV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CINETV_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :launcher:testDebugUnitTest --console=plain

      - name: Build signed release
        env:
          CINETV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINETV_RELEASE_KEYSTORE_PASSWORD }}
          CINETV_RELEASE_KEY_ALIAS: ${{ secrets.CINETV_RELEASE_KEY_ALIAS }}
          CINETV_RELEASE_KEY_PASSWORD: ${{ secrets.CINETV_RELEASE_KEY_PASSWORD }}
          CINETV_PRIVATE_ASSETS: /nonexistent
        run: ./gradlew :launcher:assembleRelease -PcineTvVersion="$TAG" --console=plain

      - name: Verify APK (signature, pinned certificate, not debuggable, no secrets)
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          cp launcher/build/outputs/apk/release/launcher-release.apk dist/CineTV.apk
          bash scripts/release/verify_apk.sh dist/CineTV.apk
          cp dist/CineTV.apk "dist/CineTV-$VER.apk"
          cp scripts/windows/CineTV-Kur.bat dist/CineTV-Kur.bat
          (cd dist && sha256sum CineTV.apk "CineTV-$VER.apk" CineTV-Kur.bat > SHA256SUMS.txt)
          # the release notes are this version's own section of CHANGELOG.md
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "CineTV $TAG" > dist/notes.md

      # Same file names as every earlier release (the Windows installer and the guides fetch CineTV.apk from "latest").
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${TAG#v}"
          FILES="dist/CineTV.apk dist/CineTV-$VER.apk dist/CineTV-Kur.bat dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "CineTV $TAG" --notes-file dist/notes.md --latest
          else
            gh release create "$TAG" $FILES --target "$(git rev-parse HEAD)" --title "CineTV $TAG" --notes-file dist/notes.md --latest
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
