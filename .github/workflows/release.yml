name: Release

# Push a tag like v2.0.0 to build, sign, verify and publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v2.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.CINETV_RELEASE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.CINETV_RELEASE_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.CINETV_RELEASE_KEY_ALIAS }}
        run: |
          [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$AL" ] || {
            echo "::error::Release signing secrets are missing. See docs/RELEASE.md."; exit 1; }

      - name: Restore keystore (temporary, deleted after the job)
        env:
          KS: ${{ secrets.CINETV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CINETV_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :launcher:testDebugUnitTest --console=plain

      - name: Build signed release
        env:
          CINETV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINETV_RELEASE_KEYSTORE_PASSWORD }}
          CINETV_RELEASE_KEY_ALIAS: ${{ secrets.CINETV_RELEASE_KEY_ALIAS }}
          CINETV_RELEASE_KEY_PASSWORD: ${{ secrets.CINETV_RELEASE_KEY_PASSWORD }}
          CINETV_PRIVATE_ASSETS: /nonexistent
        run: ./gradlew :launcher:assembleRelease -PcineTvVersion="$TAG" --console=plain

      - name: Verify APK (signature, pinned certificate, not debuggable, no secrets)
        run: |
          mkdir -p dist
          cp launcher/build/outputs/apk/release/launcher-release.apk "dist/cinetv-$TAG.apk"
          bash scripts/release/verify_apk.sh "dist/cinetv-$TAG.apk"
          (cd dist && sha256sum "cinetv-$TAG.apk" > SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CineTV ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/cinetv-${{ env.TAG }}.apk
            dist/SHA256SUMS.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
