name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shell scripts parse
        run: for f in install.sh scripts/*.sh scripts/*/*.sh; do bash -n "$f"; done
      - name: Unit tests
        run: ./gradlew :launcher:testDebugUnitTest --console=plain
      - name: Debug APK
        run: ./gradlew :launcher:assembleDebug --console=plain
      - name: No private files tracked
        run: |
          if git ls-files | grep -E '\.(jks|keystore)$|keystore\.properties|signature_logo\.png|\.env' | grep -v '^launcher/debug.keystore$'; then
            echo "::error::Private files are tracked"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cinetv-debug
          path: launcher/build/outputs/apk/debug/*.apk
          retention-days: 14
