name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # the gitleaks CLI itself (the gitleaks action still runs on the deprecated Node.js 20)
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  build:
    name: Test & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Shell scripts parse
        run: for f in install.sh scripts/*.sh scripts/*/*.sh; do bash -n "$f"; done
        - name: Make gradlew executable
  run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew :launcher:testDebugUnitTest --console=plain
      - name: Debug APK
        run: ./gradlew :launcher:assembleDebug --console=plain
      - name: No private files tracked
        run: |
          if git ls-files | grep -E '\.(jks|keystore)$|keystore\.properties|signature_logo\.png|\.env' | grep -v '^launcher/debug.keystore$'; then
            echo "::error::Private files are tracked"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cinetv-debug
          path: launcher/build/outputs/apk/debug/*.apk
          retention-days: 14
