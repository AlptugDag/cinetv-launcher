name: CineTV CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Test Suites
        run: bash scripts/run_tests.sh

  build:
    name: Build & Package APK
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Utilities & Verify SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y zip unzip
          echo "Using Android SDK at: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"

      - name: Compile and Package CineTV Launcher
        env:
          CINETV_RELEASE_KEYSTORE_BASE64: ${{ secrets.CINETV_RELEASE_KEYSTORE_BASE64 }}
          CINETV_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINETV_RELEASE_KEYSTORE_PASSWORD }}
          CINETV_RELEASE_KEY_ALIAS: ${{ secrets.CINETV_RELEASE_KEY_ALIAS }}
          CINETV_RELEASE_KEY_PASSWORD: ${{ secrets.CINETV_RELEASE_KEY_PASSWORD }}
        run: |
          bash launcher/build.sh

      - name: Generate Reproducible Cryptographic Checksums
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum cinetv-launcher-v1.0.0.apk tv-master-launcher-v1.0.0.apk > SHA256SUMS.txt
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 cinetv-launcher-v1.0.0.apk tv-master-launcher-v1.0.0.apk > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinetv-launcher-apk
          path: |
            release/cinetv-launcher-v1.0.0.apk
            release/tv-master-launcher-v1.0.0.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
