name: Register Verified TV Device

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register-device:
    if: startsWith(github.event.issue.title, '[Verified Device]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse and append verified device to devices/tested_devices.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - << 'EOF'
          import json, os, re, sys

          body = os.environ.get("ISSUE_BODY", "")
          m = re.search(r"```json\s*(\{.*?\})\s*```", body, re.DOTALL)
          if not m:
              print("No JSON payload found in issue body.")
              sys.exit(0)

          payload = json.loads(m.group(1))
          brand = payload.get("brand") or payload.get("manufacturer") or "Android TV"
          model = payload.get("model") or "Smart TV"
          board = f"{payload.get('board', 'unknown')} ({payload.get('hardware', 'SoC')})"
          os_ver = f"Android TV {payload.get('android_release', '')} (SDK {payload.get('android_sdk', '')})"
          display = f"{payload.get('display_panel', '4K UHD')}, {payload.get('hdr_formats', 'HDR')}, {payload.get('color_gamut', '')}".strip(", ")
          ram_mb = int(payload.get("ram_mb", 2048))
          tier = payload.get("tier", "BALANCED")

          db_path = "devices/tested_devices.json"
          with open(db_path, "r", encoding="utf-8") as f:
              db = json.load(f)

          devices = db.get("tested_devices", [])
          for d in devices:
              if d.get("model", "").lower() == model.lower() and d.get("board", "").lower() == board.lower():
                  print(f"Device {model} ({board}) already registered.")
                  sys.exit(0)

          devices.append({
              "brand": brand,
              "model": model,
              "board": board,
              "os": os_ver,
              "display": display,
              "ram_mb": ram_mb,
              "tier": tier,
              "status": "Doğrulandı · Kusursuz (60 FPS)",
              "features_verified": [
                  "DVD Vitrin (3D Cover Flow)",
                  "TV Denetçisi Donanım Doğrulaması",
                  "Nuvio Medya Merkezi Entegrasyonu",
                  "Telefon Web Kumandası"
              ],
              "notes": payload.get("user_notes", "TV Denetçisi telemetrisi ile otomatik doğrulandı.")
          })

          with open(db_path, "w", encoding="utf-8") as f:
              json.dump(db, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Added {brand} {model} to {db_path}")
          EOF

      - name: Commit updated tested_devices.json
        run: |
          if git diff --quiet devices/tested_devices.json; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add devices/tested_devices.json
            git commit -m "chore(devices): register verified TV from issue #${{ github.event.issue.number }}"
            git push
          fi
