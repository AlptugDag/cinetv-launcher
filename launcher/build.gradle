plugins {
    id 'com.android.application'
}

// Release signing is resolved, in order, from:
//   1. Environment variables (CI): CINETV_RELEASE_KEYSTORE (path), CINETV_RELEASE_KEYSTORE_PASSWORD,
//      CINETV_RELEASE_KEY_ALIAS, CINETV_RELEASE_KEY_PASSWORD
//   2. A keystore.properties file outside version control (path in CINETV_KEYSTORE_PROPERTIES,
//      default ~/.cinetv/release/keystore.properties) with storeFile/storePassword/keyAlias/keyPassword.
// Without either, release builds fail instead of silently falling back to the debug key.
def releaseSigning = { ->
    def env = System.getenv()
    if (env.CINETV_RELEASE_KEYSTORE && env.CINETV_RELEASE_KEYSTORE_PASSWORD && env.CINETV_RELEASE_KEY_ALIAS) {
        return [
            storeFile    : file(env.CINETV_RELEASE_KEYSTORE),
            storePassword: env.CINETV_RELEASE_KEYSTORE_PASSWORD,
            keyAlias     : env.CINETV_RELEASE_KEY_ALIAS,
            keyPassword  : env.CINETV_RELEASE_KEY_PASSWORD ?: env.CINETV_RELEASE_KEYSTORE_PASSWORD
        ]
    }
    def propsPath = env.CINETV_KEYSTORE_PROPERTIES ?: "${System.getProperty('user.home')}/.cinetv/release/keystore.properties"
    def propsFile = file(propsPath)
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def store = new File(props.getProperty('storeFile'))
        if (!store.isAbsolute()) store = new File(propsFile.parentFile, props.getProperty('storeFile'))
        return [
            storeFile    : store,
            storePassword: props.getProperty('storePassword'),
            keyAlias     : props.getProperty('keyAlias'),
            keyPassword  : props.getProperty('keyPassword') ?: props.getProperty('storePassword')
        ]
    }
    return null
}()

android {
    namespace 'com.cinetv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.cinetv.launcher"
        minSdk 26
        targetSdk 34
        // Release builds take the version from the git tag (CI passes -PcineTvVersion=1.0.0).
        def ver = (project.findProperty('cineTvVersion') ?: '1.0.0.12').toString().replaceFirst('^v', '')
        def parts = ver.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int }
        versionName ver
        // Numbering restarted at 1.0.0 after 3.2.0: the 1000000 base keeps codes above every older build's, so
        // TVs that had them still take updates (Android refuses a lower code without wiping the app's data).
        // A fourth part counts small fixes: 1.0.0.1 = 1100001. Letter suffixes boost code so 1.0.0.9b > 1.0.0.9.
        def part = { i -> parts.size() > i ? parts[i] : 0 }
        def suffixBoost = ver.endsWith('b') ? 1 : (ver.endsWith('c') ? 2 : (ver.endsWith('d') ? 3 : 0))
        def p3 = parts.size() >= 5 ? (part(3) * 10 + part(4)) : part(3)
        versionCode 1000000 + part(0) * 100000 + part(1) * 1000 + part(2) * 10 + p3 + suffixBoost
    }

    sourceSets {
        test {
            java.srcDirs = ['test']
        }
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            // Optional extra assets for a personal build, merged from outside the repo when present
            // (~/.cinetv/private/assets, or CINETV_PRIVATE_ASSETS). Public builds need none.
            def privateAssets = file(System.getenv('CINETV_PRIVATE_ASSETS') ?: "${System.getProperty('user.home')}/.cinetv/private/assets")
            assets.srcDirs = privateAssets.isDirectory() ? ['assets', privateAssets] : ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
            // Obfuscated and shrunk: the shipped app is hard to read back or alter (see Integrity.java).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease' || task.name == 'packageRelease') {
        task.doFirst {
            if (releaseSigning == null) {
                throw new GradleException(
                    "Release signing is not configured. Run scripts/release/create_keystore.sh once, " +
                    "or set CINETV_RELEASE_KEYSTORE* environment variables.")
            }
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
