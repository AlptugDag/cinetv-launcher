<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CineTV by Alptuğ Dağ</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.png">
<style>
:root{
  --bg:#07070c;--ink:#f5f5f7;--dim:rgba(235,235,245,.6);--faint:rgba(235,235,245,.32);
  --glass:rgba(255,255,255,.08);--glass-hi:rgba(255,255,255,.14);--edge:rgba(255,255,255,.16);
  --accent:#8b5cf6;--accent2:#c4b5fd;--ok:#34d399;--radius:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
  background:radial-gradient(40% 35% at 20% 10%,rgba(139,92,246,.35),transparent 70%),
             radial-gradient(35% 30% at 85% 30%,rgba(56,189,248,.18),transparent 70%),
             radial-gradient(45% 40% at 50% 100%,rgba(236,72,153,.16),transparent 70%);filter:blur(10px)}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  background:linear-gradient(var(--bg) 55%,transparent)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand b{font-size:22px;letter-spacing:-.02em}
.tv{color:#ff1e1e}
.brand .sig{width:34px;height:34px;object-fit:contain;margin-right:-2px}
.brand .st{font-size:12px;color:var(--dim);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.brand em{font-style:normal}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.search{display:flex;align-items:center;gap:10px;padding:12px 16px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:16px}
.search svg{opacity:.7}
main{padding:0 16px calc(96px + var(--safe-b))}
section{display:none}section.on{display:block}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/3;background:var(--glass);
  box-shadow:0 8px 20px rgba(0,0,0,.45);transform:translateZ(0);transition:transform .25s}
.card:active{transform:scale(.96)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{position:absolute;inset:auto 0 0 0;padding:22px 8px 7px;font-size:11.5px;font-weight:600;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.card .badge{position:absolute;top:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55)}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.answer{padding:14px 16px;font-size:15px;line-height:1.45;border-left:3px solid var(--accent2)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:9;display:flex;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:11px;padding:8px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink);background:var(--glass-hi)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);
  border-radius:28px 28px 0 0;padding:18px 18px calc(22px + var(--safe-b));max-height:86vh;overflow:auto}
.sheet.on{transform:none}
.sheet .row{display:flex;gap:16px}
.sheet img{width:110px;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.sheet h3{margin:4px 0 6px;font-size:20px;line-height:1.2}
.meta{color:var(--dim);font-size:13px}
.ov{color:var(--dim);font-size:14px;margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#9b6cff,#7c3aed);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(124,58,237,.45)}
a.btn{text-decoration:none}
label.btn{cursor:pointer}
.install{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.install span{flex:1}
.install button{border:0;border-radius:12px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
.install .x{background:none;color:var(--dim);padding:6px}
.btn.ghost{background:var(--glass-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-140%);transition:.3s;z-index:40;padding:10px 18px;font-size:14px}
.toast.on{transform:translate(-50%,0)}
/* remote */
.pad{margin:20px auto 8px;width:260px;height:260px;border-radius:50%;position:relative}
.pad button{position:absolute;background:none;border:0;color:var(--ink);font-size:22px;width:80px;height:80px}
.pad .u{top:0;left:90px}.pad .d{bottom:0;left:90px}.pad .l{left:0;top:90px}.pad .r{right:0;top:90px}
.pad .ok{left:75px;top:75px;width:110px;height:110px;border-radius:50%;background:var(--glass-hi);font-size:16px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.keys button{padding:16px 0;font-size:14px;color:var(--ink);border:1px solid var(--edge)}
.field{display:flex;gap:8px;margin-top:16px;padding:6px 6px 6px 14px;align-items:center}
.field input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:15px}
.field button{border:0;border-radius:14px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600}
/* calibration */
.cal{padding:16px;margin-top:12px}
.slider{margin:14px 0}
.slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:6px}
.slider label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.3))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px}
.chip.on{background:var(--accent);border-color:transparent}
.note{font-size:12.5px;color:var(--dim);margin-top:8px}
.brand small{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.01em;margin-left:-4px;align-self:flex-end;padding-bottom:3px}
.wait{padding:14px 16px;margin-top:12px;display:flex;gap:12px;align-items:center;font-size:14px}
.wait i{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent);animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.3;transform:scale(.7)}}
.about{padding:20px;margin-top:14px;text-align:center}
.about .sig2{width:120px;height:56px;object-fit:contain;margin:4px auto 0;display:block;opacity:.9}
.about img.photo{width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:70% 30%;box-shadow:0 10px 30px rgba(139,92,246,.45);border:2px solid rgba(255,255,255,.2)}
.about h3{margin:14px 0 2px;font-size:22px}
.about .role{color:var(--accent2);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.about p{color:var(--dim);font-size:14px;text-align:left;margin:16px 0}
.follow{display:grid;gap:10px;margin-top:6px}
.btn.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4);box-shadow:0 10px 24px rgba(221,42,123,.4)}
.btn.yt{background:linear-gradient(180deg,#ff3b3b,#d40000);box-shadow:0 10px 24px rgba(212,0,0,.4)}
.cast{padding:16px;margin-top:12px}
.cast textarea{width:100%;min-height:84px;background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:15px/1.4 inherit;padding:12px;resize:vertical;outline:0}
.found{display:grid;gap:8px;margin-top:12px}
.found button{text-align:left;border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;word-break:break-all}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><img class="sig" src="/static/signature.png" alt="" onerror="this.remove()"><b>Cine<span class="tv">TV</span></b><small>by Alptuğ Dağ</small><span class="st" id="tvPick"><i id="dot" class="dot"></i><em id="status" data-i="connecting"></em></span></div>
  <div class="install glass" id="install" hidden><span id="installText"></span><button id="installGo" hidden></button><button class="x" id="installX">✕</button></div>
  <form class="search glass" id="searchBox" onsubmit="return false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" data-ph="searchPh">
  </form>
</header>

<main>
  <section id="tab-search" class="on">
    <div class="wait glass" id="waitBox" hidden><i></i><span id="waitText"></span></div>
    <h2 id="listTitle" data-i="trending"></h2>
    <div class="grid" id="results"></div>
  </section>

  <section id="tab-remote">
    <div class="pad glass">
      <button class="u" data-key="19">▲</button><button class="d" data-key="20">▼</button>
      <button class="l" data-key="21">◀</button><button class="r" data-key="22">▶</button>
      <button class="ok" data-key="23">OK</button>
    </div>
    <div class="keys">
      <button class="glass" data-key="4" data-i="back"></button>
      <button class="glass" data-key="3" data-i="home"></button>
      <button class="glass" data-key="82" data-i="menu"></button>
      <button class="glass" data-key="25">🔉</button>
      <button class="glass" data-key="164">🔇</button>
      <button class="glass" data-key="24">🔊</button>
    </div>
    <div class="field glass">
      <input id="tvq" data-ph="tvSearchPh">
      <button id="tvqGo" data-i="send"></button>
    </div>
    <button class="btn ghost" style="margin-top:12px" id="saver" data-i="screensaver"></button>
  </section>

  <section id="tab-cast">
    <div class="cast glass">
      <h2 style="margin-top:0" data-i="castTitle"></h2>
      <textarea id="castUrl" data-ph="castPh" autocapitalize="off" autocomplete="off"></textarea>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn ghost" id="castPaste" style="flex:1" data-i="paste"></button>
        <button class="btn" id="castGo" style="flex:2" data-i="castPlay"></button>
      </div>
      <p class="note" data-i="castNote"></p>
      <div class="found" id="castFound"></div>
    </div>
  </section>

  <section id="tab-bg">
    <div class="cast glass">
      <h2 style="margin-top:0" data-i="bgTitle"></h2>
      <p class="note" data-i="bgNote"></p>
      <label class="btn" style="margin-top:12px"><input type="file" id="bgFile" accept="image/*" hidden><span data-i="bgPick"></span></label>
      <img id="bgPreview" alt="" style="width:100%;border-radius:14px;margin-top:12px" hidden>
    </div>
  </section>

  <section id="tab-about">
    <div class="about glass">
      <img class="photo" id="aboutPhoto" src="/static/creator.jpg" alt="Alptuğ Dağ" onerror="this.hidden=true">
      <h3>Alptuğ Dağ</h3>
      <img class="sig2" src="/static/signature.png" alt="" onerror="this.remove()">
      <div class="role" data-i="aboutRole"></div>
      <p id="aboutBio" data-i="aboutBio"></p>
      <div class="follow">
        <a class="btn ig" id="igBtn" target="_blank" rel="noopener" data-i="followIg"></a>
        <a class="btn yt" id="ytBtn" target="_blank" rel="noopener" data-i="followYt"></a>
        <button class="btn ghost" id="hisFilms" data-i="hisFilms"></button>
      </div>
    </div>
    <p class="note" style="text-align:center;margin-top:14px" data-i="homeHint"></p>
  </section>

</main>

<nav class="glass">
  <button class="on" data-tab="search"><span>🎬</span><span data-i="tabSearch"></span></button>
  <button data-tab="remote"><span>🕹️</span><span data-i="tabRemote"></span></button>
  <button data-tab="cast"><span>📡</span><span data-i="tabCast"></span></button>
  <button data-tab="bg"><span>🖼️</span><span data-i="tabBg"></span></button>
  <button data-tab="about"><span>✦</span><span data-i="tabAbout"></span></button>
</nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet glass" id="sheet"></div>
<div class="toast glass" id="toast"></div>

<script>
(() => {
  const T = {
    en: {aboutBio:"Alptuğ Dağ is a filmmaker, storyteller and voice artist, born in Ankara in 2000. He is known for his short film Sessiz (2023). He designed and built CineTV.",tabBg:"Background",bgTitle:"Background of Home",bgNote:"Pick a photo: it becomes the backdrop of the TV's home screen right away. Picking a theme on the TV brings the built-in scenery back.",bgPick:"Choose a photo",bgSent:"Now on your TV",bgFail:"Could not send the picture",
      installAndroid:"Install CineTV on this phone for one-tap access.",installGo:"Install",installIos:"Tap Share, then “Add to Home Screen” to keep CineTV one tap away.",
      otherTvs:"CineTV TVs here",onTv:"On your TV now",waiting:"Allow this phone on your TV with the remote",denied:"Not allowed on the TV. Tap to ask again.",busy:"Another phone is asking. Retrying…",
      tabCast:"Cast",tabAbout:"About",castTitle:"Play a video on the TV",castPh:"Paste a video link or any page with a video",paste:"Paste",castPlay:"Play on TV",
      castNote:"Works with direct links (mp4, m3u8…) and most pages that contain a video; the TV finds the stream itself.",castFinding:"Looking for the video…",castNone:"No playable video found on that page.",castPlaying:"Playing on your TV",
      aboutRole:"Filmmaker · Storyteller",followIg:"Follow on Instagram",followYt:"Subscribe on YouTube",hisFilms:"Show his films on the TV",
      homeHint:"Tip: Share › Add to Home Screen keeps CineTV one tap away, full screen.",
      connecting:"Connecting…",connected:"Connected",offline:"TV not reachable",searchPh:"Films, series, people…",trending:"Trending",
      results:"Results",noResults:"Nothing found",openTv:"Open on TV",opening:"Opening on your TV…",movie:"Film",series:"Series",
      back:"Back",home:"Home",menu:"Menu",send:"Send",tvSearchPh:"Search or ask on the TV",screensaver:"Start screensaver",
      tabSearch:"Discover",tabRemote:"Remote",tabCal:"Picture",presets:"Presets",patterns:"Test patterns",picture:"Picture engine",
      warmth:"Colour temperature",reset:"Restore my original settings",patternNote:"Choose a pattern, adjust until it looks right, then tap Off.",
      noPanel:"This TV takes picture changes only from its own menu. Show a pattern here, then adjust Picture settings with the TV remote until the pattern looks right.",
      p_natural:"Natural",p_cinema:"Cinema",p_night:"Dark room",p_vivid:"Vivid",
      t_off:"Off",t_gray:"Gray ramp",t_bars:"Colour bars",t_black:"Black level",t_white:"White level",t_skin:"Skin tones",
      backlight:"Backlight",brightness:"Brightness",contrast:"Contrast",saturation:"Colour",hue:"Tint",sharpness:"Sharpness",red:"Red gain",green:"Green gain",blue:"Blue gain",done:"Saved"},
    tr: {aboutBio:"Alptuğ Dağ, 2000'de Ankara'da doğmuş bir sinemacı, hikâye anlatıcı ve seslendirme sanatçısıdır. Yönettiği kısa film Sessiz (2023) ile tanınır. CineTV'yi tasarlayıp geliştirdi.",tabBg:"Arka plan",bgTitle:"Ana ekranın arka planı",bgNote:"Bir fotoğraf seçin: televizyonun ana ekranında hemen arka plan olur. Televizyonda bir tema seçince yerleşik manzara geri gelir.",bgPick:"Fotoğraf seç",bgSent:"Televizyonda",bgFail:"Resim gönderilemedi",
      installAndroid:"CineTV'yi bu telefona uygulama olarak ekleyin, tek dokunuşla açılsın.",installGo:"Ekle",installIos:"Paylaş'a, ardından “Ana Ekrana Ekle”ye dokunun; CineTV tek dokunuşla açılsın.",
      otherTvs:"Bu ağdaki CineTV televizyonları",onTv:"TV'de vitrine geldi",waiting:"Bu telefona TV'den kumandayla izin verin",denied:"TV'de izin verilmedi. Tekrar sormak için dokunun.",busy:"Başka bir telefon soruyor. Tekrar deneniyor…",
      tabCast:"Yayınla",tabAbout:"Hakkımda",castTitle:"TV'de video oynat",castPh:"Bir video bağlantısı ya da videolu herhangi bir sayfa yapıştırın",paste:"Yapıştır",castPlay:"TV'de oynat",
      castNote:"Doğrudan bağlantılarla (mp4, m3u8…) ve video içeren çoğu sayfayla çalışır; yayını TV kendisi bulur.",castFinding:"Video aranıyor…",castNone:"Bu sayfada oynatılabilir video bulunamadı.",castPlaying:"TV'de oynatılıyor",
      aboutRole:"Sinemacı · Hikâye anlatıcı",followIg:"Instagram'da takip et",followYt:"YouTube'da abone ol",hisFilms:"Filmlerini TV'de göster",
      homeHint:"İpucu: Paylaş › Ana Ekrana Ekle ile CineTV tam ekran, tek dokunuşla açılır.",
      connecting:"Bağlanıyor…",connected:"Bağlı",offline:"TV'ye ulaşılamıyor",searchPh:"Film, dizi, oyuncu…",trending:"Trend",
      results:"Sonuçlar",noResults:"Bir şey bulunamadı",openTv:"TV'de aç",opening:"TV'de açılıyor…",movie:"Film",series:"Dizi",
      back:"Geri",home:"Ana sayfa",menu:"Menü",send:"Gönder",tvSearchPh:"TV'de ara veya sor",screensaver:"Ekran koruyucuyu başlat",
      tabSearch:"Keşfet",tabRemote:"Kumanda",tabCal:"Görüntü",presets:"Hazır ayarlar",patterns:"Test desenleri",picture:"Görüntü motoru",
      warmth:"Renk sıcaklığı",reset:"Orijinal ayarlarıma dön",patternNote:"Bir desen seçin, doğru görünene kadar ayarlayın, sonra Kapat'a dokunun.",
      noPanel:"Bu TV görüntü değişikliklerini yalnızca kendi menüsünden kabul ediyor. Buradan bir desen gösterin, sonra TV kumandasıyla Görüntü ayarlarını desen doğru görünene kadar değiştirin.",
      p_natural:"Doğal",p_cinema:"Sinema",p_night:"Karanlık oda",p_vivid:"Canlı",
      t_off:"Kapat",t_gray:"Gri geçiş",t_bars:"Renk çubukları",t_black:"Siyah seviyesi",t_white:"Beyaz seviyesi",t_skin:"Ten tonları",
      backlight:"Arka ışık",brightness:"Parlaklık",contrast:"Kontrast",saturation:"Renk",hue:"Ton",sharpness:"Keskinlik",red:"Kırmızı kazanç",green:"Yeşil kazanç",blue:"Mavi kazanç",done:"Kaydedildi"}
  };
  const L = T[(navigator.language||"en").slice(0,2)] || T.en;
  const t = k => L[k] || T.en[k] || k;
  document.documentElement.lang = (navigator.language||"en").slice(0,2);
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));

  const url = new URL(location.href);
  // On the plain address, hop to the TV's secure one (no "not secure" warning) when this phone can reach it.
  if (location.protocol === "http:") {
    (async () => {
      try {
        const info = await (await fetch("/api/info", {cache: "no-store"})).json();
        if (!info.secure) return;
        const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
        const ping = await fetch(info.secure + "/api/ping", {mode: "cors", signal: ctl.signal});
        if (!ping.ok) return;
        let k = url.searchParams.get("k"); try { k = k || localStorage.getItem("cinetv.k"); } catch (e) {}
        location.replace(info.secure + "/" + (k ? "?k=" + encodeURIComponent(k) : "") + location.hash);
      } catch (e) {}
    })();
  }
  let token = url.searchParams.get("k");
  try { if (token) localStorage.setItem("cinetv.k", token); else token = localStorage.getItem("cinetv.k"); } catch (e) {}
  if (url.searchParams.has("k")) history.replaceState(null, "", "/" + location.hash);

  const $ = id => document.getElementById(id);
  const api = async (path, params = {}) => {
    if (!token) { pair(); throw 0; }
    const qs = new URLSearchParams(Object.assign({k: token}, params));
    const r = await fetch("/api/" + path + "?" + qs, {cache: "no-store"});
    if (r.status === 401) { token = null; try { localStorage.removeItem("cinetv.k"); } catch (e) {} pair(); throw 0; }
    return r.json();
  };
  const open = async path => (await fetch("/api/" + path, {cache: "no-store"})).json();

  // Pairing without a QR code: the TV asks "may this phone connect?" and the viewer allows it.
  let pairing = false;
  const waitBox = $("waitBox"), waitText = $("waitText");
  const pair = async () => {
    if (pairing) return; pairing = true;
    waitBox.hidden = false; waitBox.onclick = null; waitText.textContent = t("waiting");
    $("status").textContent = t("connecting");
    try {
      let req = await open("pair/request");
      while (!req.ok && req.error === "busy") { waitText.textContent = t("busy"); await new Promise(r => setTimeout(r, 3000)); req = await open("pair/request"); }
      waitText.textContent = t("waiting");
      for (let i = 0; i < 120; i++) {
        await new Promise(r => setTimeout(r, 1500));
        const c = await open("pair/claim?id=" + encodeURIComponent(req.id));
        if (c.state === "allowed") { token = c.k; try { localStorage.setItem("cinetv.k", token); } catch (e) {} waitBox.hidden = true; pairing = false; connected(); return; }
        if (c.state === "denied" || c.state === "expired") break;
      }
    } catch (e) {}
    pairing = false;
    waitText.textContent = t("denied");
    waitBox.onclick = () => pair();
  };

  let toastTimer;
  const toast = msg => { const el = $("toast"); el.textContent = msg; el.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200); };
  const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // tabs
  const show = name => {
    document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "tab-" + name));
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
    $("searchBox").style.display = name === "search" ? "" : "none";
  };
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { show(b.dataset.tab); location.hash = b.dataset.tab; });

  // discover
  const render = (list, title) => {
    $("listTitle").textContent = title;
    const box = $("results");
    if (!list.length) { box.innerHTML = `<div class="empty" style="grid-column:1/-1">${t("noResults")}</div>`; return; }
    box.innerHTML = list.map((m, i) => `<div class="card" data-i="${i}"><img loading="lazy" src="${esc(m.poster)}" alt="">
      ${m.type === "series" ? `<span class="badge">${t("series")}</span>` : ""}<div class="t">${esc(m.title)}</div></div>`).join("");
    box.querySelectorAll(".card").forEach(c => c.onclick = () => openSheet(list[+c.dataset.i]));
  };
  const skeleton = () => $("results").innerHTML = Array.from({length: 9}, () => '<div class="card skeleton"></div>').join("");
  const trending = async () => { if (!token) return; skeleton(); try { render((await api("catalog/trending")).results || [], t("trending")); } catch (e) {} };
  let searchTimer, seq = 0;
  // Typing shows in the TV's search bar; Enter (or the keyboard's Search) fills the TV's shelf.
  let mirrorTimer;
  $("q").addEventListener("input", e => {
    clearTimeout(mirrorTimer);
    const q = e.target.value.trim();
    mirrorTimer = setTimeout(() => api("tv/typing", {q}).catch(() => {}), 450);
  });
  $("searchBox").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("q").value.trim(); if (!q) return;
    $("q").blur();
    api("tv/search", {q}).then(() => toast(t("onTv"))).catch(() => {});
    // The phone shows the assistant's answer too.
    const my = ++seq; skeleton();
    api("catalog/search", {q, ai: 1}).then(r => {
      if (my !== seq) return;
      render(r.results || [], r.title || t("results"));
      if (r.answer) {
        if (!(r.results || []).length) $("results").innerHTML = "";
        $("results").insertAdjacentHTML("afterbegin", `<div class="answer glass" style="grid-column:1/-1">${esc(r.answer)}</div>`);
      }
    }).catch(() => {});
  });
  $("q").addEventListener("input", e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(async () => {
      if (!q) return trending();
      const my = ++seq; skeleton();
      try {
        const r = await api("catalog/search", {q});
        if (my !== seq) return;
        render(r.results || [], t("results"));
      } catch (e) {}
    }, 400);
  });

  const sheet = $("sheet"), bg = $("sheetBg");
  const closeSheet = () => { sheet.classList.remove("on"); bg.classList.remove("on"); };
  bg.onclick = closeSheet;
  const openSheet = m => {
    sheet.innerHTML = `<div class="row"><img src="${esc(m.poster)}" alt=""><div>
      <h3>${esc(m.title)}</h3><div class="meta">${m.year || ""} · ${m.type === "series" ? t("series") : t("movie")}${m.rating ? " · ★ " + (+m.rating).toFixed(1) : ""}</div></div></div>
      <p class="ov">${esc(m.overview)}</p><button class="btn" id="go">▶︎ ${t("openTv")}</button>`;
    sheet.classList.add("on"); bg.classList.add("on");
    $("go").onclick = async () => {
      $("go").disabled = true;
      try { const r = await api("open", {imdb: m.imdb || "", tmdb: m.tmdb || 0, type: m.type, title: m.title, poster: m.poster});
        toast(r.ok ? t("opening") : t("noResults")); } catch (e) { toast(t("offline")); }
      closeSheet();
    };
  };

  // remote
  document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => { navigator.vibrate && navigator.vibrate(8); api("key", {code: b.dataset.key}).catch(() => {}); });
  $("tvqGo").onclick = () => { const q = $("tvq").value.trim(); if (q) { api("tv/search", {q}); $("tvq").value = ""; toast(t("done")); } };
  $("saver").onclick = () => api("screensaver");


  // cast
  $("castPaste").onclick = async () => { try { $("castUrl").value = await navigator.clipboard.readText(); } catch (e) { $("castUrl").focus(); } };
  const castPlay = async u => {
    try { const r = await api("cast/play", {url: u}); toast(r.ok ? t("castPlaying") : t("castNone")); } catch (e) {}
  };
  $("castGo").onclick = async () => {
    const u = $("castUrl").value.trim(); if (!u) return;
    $("castFound").innerHTML = ""; toast(t("castFinding"));
    try {
      const r = await api("cast/find", {url: u});
      const list = r.videos || [];
      if (!list.length) return toast(t("castNone"));
      if (list.length === 1) return castPlay(list[0].url);
      $("castFound").innerHTML = list.map((v, i) => `<button data-v="${i}">▶︎ ${esc(v.label || v.url)}</button>`).join("");
      $("castFound").querySelectorAll("button").forEach(b => b.onclick = () => castPlay(list[+b.dataset.v].url));
    } catch (e) { toast(t("offline")); }
  };

  // about
  $("igBtn").href = "https://instagram.com/alptugdag";
  $("ytBtn").href = "https://www.youtube.com/@AlptugDag?sub_confirmation=1";
  $("hisFilms").onclick = () => api("tv/search", {q: "Alptuğ Dağ filmleri"}).then(() => toast(t("done"))).catch(() => {});
  open("about").then(a => {
    // Builds without the author's photo file fall back to his TMDB portrait.
    const ph = $("aboutPhoto"); if (a.photo && ph && (ph.hidden || !ph.naturalWidth)) { ph.src = a.photo; ph.hidden = false; }
  }).catch(() => {});

  // background from the phone: resized here (max 1920 px), sent as JPEG
  $("bgFile").onchange = async e => {
    const file = e.target.files && e.target.files[0]; if (!file || !token) return;
    try {
      const img = await createImageBitmap(file);
      const s = Math.min(1, 1920 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.86));
      $("bgPreview").src = URL.createObjectURL(blob); $("bgPreview").hidden = false;
      const r = await fetch("/api/wallpaper?k=" + encodeURIComponent(token), {method: "POST", body: blob, headers: {"Content-Type": "image/jpeg"}});
      toast((await r.json()).ok ? t("bgSent") : t("bgFail"));
    } catch (err) { toast(t("bgFail")); }
  };

  // "Add to Home Screen": a real prompt on Android, a hint on iPhone; never once it is installed
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem("cinetv.installX") === "1"; } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
  const showInstall = (text, go) => {
    if (standalone || dismissed) return;
    $("installText").textContent = text; $("install").hidden = false;
    if (go) { $("installGo").textContent = t("installGo"); $("installGo").hidden = false; $("installGo").onclick = go; }
  };
  $("installX").onclick = () => { $("install").hidden = true; try { localStorage.setItem("cinetv.installX", "1"); } catch (e) {} };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); showInstall(t("installAndroid"), () => { e.prompt(); $("install").hidden = true; }); });
  if (/iPhone|iPad/.test(navigator.userAgent) && !standalone) showInstall(t("installIos"));

  // several CineTV TVs on this network: tap the status to switch
  open("info").then(info => {
    if (info.name) $("status").dataset.tv = info.name;
    const peers = info.peers || [];
    if (!peers.length) return;
    $("tvPick").style.cursor = "pointer";
    $("tvPick").onclick = () => {
      sheet.innerHTML = `<h3>${t("otherTvs")}</h3>` + [{name: info.name, url: ""}].concat(peers).map(p =>
        `<button class="btn ${p.url ? "ghost" : ""}" style="margin-top:10px" data-u="${esc(p.url)}">📺 ${esc(p.name)}</button>`).join("");
      sheet.classList.add("on"); bg.classList.add("on");
      sheet.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { if (b.dataset.u) location.href = b.dataset.u; else closeSheet(); });
    };
  }).catch(() => {});

  // connect
  const connected = () => {
    api("hello").then(() => { $("dot").classList.add("on"); $("status").textContent = $("status").dataset.tv || t("connected"); })
      .catch(() => { if (token) $("status").textContent = t("offline"); });
    trending();
  };
  if (token) connected(); else pair();
  const start = location.hash.replace("#", "");
  if (["remote", "search", "cast", "about", "bg", "background"].includes(start)) show(start === "background" ? "bg" : start);
})();
</script>
</body>
</html>
